sonar.projectKey=Alan-Jose-Araujo_pandemic_sim
sonar.organization=alan-jose-araujo

sonar.projectName=pandemic_sim
sonar.projectVersion=1.1.0

# CMake C++ source and header files.
sonar.sources=src,include

# GoogleTest-based unit tests.
sonar.tests=tests
sonar.test.inclusions=tests/**/*

# Ignore generated files and downloaded build dependencies.
sonar.exclusions=build/**/*,.git/**/*
sonar.coverage.exclusions=tests/**/*

# CMake exports this database during configuration.
sonar.cfamily.compile-commands=build/compile_commands.json

sonar.sourceEncoding=UTF-8